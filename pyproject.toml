[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esdm"
version = "0.1.2"
description = "Entropic Semantic Diffusion Model — entropic-time spectral diffusion with dual-space item-kernel fusion"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Lorenzo Moriondo", email = "tunedconsulting@gmail.com" }]
keywords = [
    "diffusion",
    "entropic-time",
    "spectral",
    "vibrational",
    "arrowspace",
    "variational-autoencoder",
    "graph-laplacian",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
# torch is NOT pinned here because the correct wheel depends on CUDA/ROCm/MPS.
# Install it separately before this package:
#
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu121
#   uv pip install -e .
#
dependencies = [
    "torch>=2.3",
    "scipy>=1.13",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "einops>=0.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pandas>=2.2",
    "transformers>=4.40",
    "arrowspace_tuner>=0.3.1"
    # VDT modules are vendored in esdm/_vendor; no external git dependency.
]

# ---------------------------------------------------------------------------
# Optional extras
# ---------------------------------------------------------------------------
[project.optional-dependencies]
wandb = ["wandb>=0.17"]
datasets = [
    "transformers>=4.40",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
]
all = [
    "wandb>=0.17",
    "transformers>=4.40",
]

# ---------------------------------------------------------------------------
# Console entry points
# ---------------------------------------------------------------------------
# Console entry points
# ---------------------------------------------------------------------------
# CLI entry points registered after the migration completes.
[project.scripts]
esdm-train = "esdm.cli.train:main"
esdm-sweep = "esdm.cli.sweep:main"
esdm-build = "esdm.cli.build_laplacian:main"

# ---------------------------------------------------------------------------
# Package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["esdm", "esdm._vendor", "esdm.experiments"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
esdm = ["py.typed"]

# ---------------------------------------------------------------------------
# Project URLs
# ---------------------------------------------------------------------------
[project.urls]
"Homepage"    = "https://github.com/tuned-org-uk/entropic-semantic-diffusion"
"Bug Tracker" = "https://github.com/tuned-org-uk/entropic-semantic-diffusion/issues"
"Source"      = "https://github.com/tuned-org-uk/entropic-semantic-diffusion"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
extend-exclude = ["esdm/_vendor"]

[tool.ruff.lint]
ignore = ["E741"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
