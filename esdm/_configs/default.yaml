# Default ESDM configuration
# Architecture constants per AGENTS.md — do NOT sweep these.
# The only free hyperparameters are lr and n_steps (governed by heat death).
# lam_s and wht_filter are treatment variables for the autoresearch loop.

model:
  dim_input: 256          # embedding dimension F (overridden per experiment)
  dim_latent: 64          # VAE latent dimension q = F/4 (overridden per experiment)
  n_nodes: 256            # corpus node count N (overridden per experiment)
  n_modes: 32             # number of spectral modes tracked (overridden per experiment)
  mode_threshold: 0.01    # threshold for classifying a spectral mode as active
  lam_s: 1.0              # precision multiplier for spectral-basis prior (barrier height)
  n_vibrational_steps: 2  # VDT recurrence depth (CFL-safe for real L_F)
  gamma: 0.1              # vibrational damping coefficient (VDT default)

clock:
  eps: 1.0e-8
  heat_death_patience: 200
  lambda_clip: 100.0      # maximum allowed Lambda_tau

training:
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 1.0e-5
  max_steps: 800
  log_every: 50
  checkpoint_every: 1000
  seed: 3407

paths:
  lf_pt: data/L_F.pt
  v_pt:  data/V.pt
  output_dir: results/
